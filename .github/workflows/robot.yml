name: Robot
# Nazwa z identyfikatorem pozwala aplikacji znaleźć uruchomienie zlecone przyciskiem „Odśwież”.
run-name: ${{ inputs.request_id && format('Robot (odświeżenie {0})', inputs.request_id) || 'Robot' }}

# Codziennie rano: aktualizacja listy konkursów, powiadomienia ntfy i publikacja aplikacji.
# Ręcznie: przycisk „Odśwież” w aplikacji albo Actions → Robot → Run workflow.
on:
  schedule:
    - cron: '17 5 * * *' # 06:17 czasu zimowego / 07:17 letniego w Polsce
  workflow_dispatch:
    inputs:
      notify:
        description: 'Wyślij powiadomienia ntfy (true/false)'
        type: string
        default: 'true'
      request_id:
        description: 'Identyfikator odświeżenia z aplikacji'
        type: string
        default: ''
      ig_force:
        description: 'Pobierz Instagram ponownie, nawet jeśli był już pobrany dzisiaj (true/false) – kosztuje'
        type: string
        default: 'false'

permissions:
  contents: write # zapis listy konkursów
  actions: write # zlecenie publikacji strony (workflow Pages)

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Rozdania z Instagrama: tylko gdy w sekretach jest APIFY_TOKEN (konto Apify, darmowe 5 USD/mies.).
      # Hashtagi można zmienić zmienną repozytorium IG_HASHTAGS, np. „rozdanie,konkurs”.
      - name: Pobierz konkursy
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_HASHTAGS: ${{ vars.IG_HASHTAGS }}
          IG_FORCE: ${{ inputs.ig_force == 'true' && '1' || '' }}
        run: node robot/scrape.mjs

      - name: Zapisz zmiany
        id: commit
        run: |
          if git diff --quiet -- site/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Robot: aktualizacja listy konkursów"
          git push || (git pull --rebase && git push)
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Publikacja w osobnym uruchomieniu workflow Pages: odświeżenie z aplikacji kończy się,
      # gdy lista jest zapisana, a ewentualny błąd publikacji go nie psuje. Commit zrobiony
      # tokenem GITHUB_TOKEN nie uruchamia „on: push”, ale zlecenie workflow_dispatch – tak.
      - name: Publikacja strony
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Powiadomienia
        if: github.event_name != 'workflow_dispatch' || inputs.notify != 'false'
        env:
          STATE_GIST_ID: ${{ secrets.STATE_GIST_ID }}
        run: node robot/notify.mjs
