name: Android

# Buduje aplikację Lootsy na Androida (APK do instalacji i AAB do Google Play)
# i publikuje je w GitHub Releases: .../releases/latest/download/lootsy.apk
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lootsy-upload.p12"
            echo "LOOTSY_KEYSTORE=$RUNNER_TEMP/lootsy-upload.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 – podpis kluczem debug (tylko do testów)"
          fi

      - name: Budowanie APK i AAB
        env:
          LOOTSY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOOTSY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME

      - name: Pliki wynikowe
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/lootsy.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/lootsy.aab
          ls -la out
          sha256sum out/*

      # Bez klucza przesyłania (sekrety ANDROID_*) APK jest podpisany losowym kluczem debug:
      # nadaje się tylko do testu, więc trafia do artefaktów, a nie do wydań.
      - name: Artefakt testowy (bez klucza)
        if: env.LOOTSY_KEYSTORE == ''
        uses: actions/upload-artifact@v7
        with:
          name: lootsy-test-debug-signed
          path: out/lootsy.apk

      - name: Wydanie w GitHub Releases
        if: env.LOOTSY_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$VERSION_NAME" out/lootsy.apk out/lootsy.aab \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lootsy $VERSION_NAME (Android)" \
            --latest \
            --notes "Lootsy na Androida / for Android.

          - **lootsy.apk** – instalacja bezpośrednio na telefonie / install directly on your phone
          - **lootsy.aab** – pakiet do Google Play / bundle for Google Play"
