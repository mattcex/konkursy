name: Pages

# Testy i publikacja aplikacji (folder site/) na GitHub Pages.
# Uruchamiany po pushu, ręcznie oraz przez robota po aktualizacji listy (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Paczka ze stroną powstaje w innym zadaniu niż publikacja: deploy-pages uruchomiony
  # zaraz po upload-pages-artifact w tym samym zadaniu potrafi nie znaleźć paczki
  # („No artifacts named github-pages”, https://github.com/actions/deploy-pages/issues/451).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
